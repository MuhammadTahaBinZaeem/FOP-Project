name: build-and-package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Configure portable static Linux package
        if: runner.os == 'Linux'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPE_STATIC_LINUX=ON
      - name: Configure universal macOS package
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Generate and compare smoke corpus
        if: runner.os != 'Windows'
        run: |
          ./build/pe-generate-tests test-data-smoke-ci 25
          ./build/pe-verify-corpus test-data-smoke-ci 0 corpus-comparison.json
        shell: bash
      - name: Generate and compare smoke corpus on Windows
        if: runner.os == 'Windows'
        run: |
          .\build\Release\pe-generate-tests.exe test-data-smoke-ci 25
          .\build\Release\pe-verify-corpus.exe test-data-smoke-ci 0 corpus-comparison.json
      - name: Package offline desktop site
        run: |
          node -e "const fs=require('fs');fs.mkdirSync('www/downloads',{recursive:true});fs.writeFileSync('www/downloads/packaging-sentinel.apk','must not be packaged');"
          cpack --config build/CPackConfig.cmake -G ZIP -C Release
      - name: Test extracted desktop ZIP
        shell: bash
        run: |
          pe_package=$(find . -maxdepth 1 -name 'PocketEngineer-0.5.0-*.zip' -print -quit)
          node tools/test_desktop_package.mjs "$pe_package" build-package-test
      - name: Verify Linux package has no dynamic loader or library dependencies
        if: runner.os == 'Linux'
        run: |
          ! readelf -l build/pocket-engineer-server | grep INTERP
          ! readelf -d build/pocket-engineer-server | grep NEEDED
          ! readelf -l build/pocket-engineer | grep INTERP
          ! readelf -d build/pocket-engineer | grep NEEDED
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: pocket-engineer-${{ matrix.os }}
          path: |
            *.zip
            corpus-comparison.json
            build-package-test/download-test.json

  android:
    name: android-release
    runs-on: ubuntu-latest
    env:
      PE_ALLOW_DEVELOPMENT_SIGNATURE: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # v3 defaults include the retired SDK package "tools".
          packages: platform-tools
      - name: Install pinned native Android build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          # This disposable Android-only runner does not use other NDK releases.
          # API35's base userdata image cannot be shrunk by disk-size alone.
          sdkmanager --list_installed | awk '$1 ~ /^ndk;[0-9.]+$/ && $1 != "ndk;26.3.11579264" {print $1}' > "$RUNNER_TEMP/pe-unused-ndks.txt"
          while IFS= read -r pe_package; do sdkmanager --uninstall "$pe_package"; done < "$RUNNER_TEMP/pe-unused-ndks.txt"
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
          df -h /usr/local/lib/android/sdk
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restore project signing key when configured
        env:
          PE_KEYSTORE_BASE64: ${{ secrets.PE_ANDROID_KEYSTORE_BASE64 }}
          PE_STORE_PASSWORD: ${{ secrets.PE_ANDROID_STORE_PASSWORD }}
          PE_KEY_ALIAS: ${{ secrets.PE_ANDROID_KEY_ALIAS }}
          PE_KEY_PASSWORD: ${{ secrets.PE_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$PE_KEYSTORE_BASE64" ]; then
            printf '%s' "$PE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pocket-engineer-release.jks"
            chmod 600 "$RUNNER_TEMP/pocket-engineer-release.jks"
            echo "PE_ANDROID_KEYSTORE=$RUNNER_TEMP/pocket-engineer-release.jks" >> "$GITHUB_ENV"
            echo "PE_ANDROID_STORE_PASSWORD=$PE_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "PE_ANDROID_KEY_ALIAS=$PE_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "PE_ANDROID_KEY_PASSWORD=$PE_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo 'project-release-key' > android-signing-status.txt
          else
            echo 'development-key; optimized release build, not production signed' > android-signing-status.txt
          fi
      - name: Assemble diagnostic debug and optimized installable release APK
        run: |
          node -e "const fs=require('fs');fs.mkdirSync('www/downloads',{recursive:true});fs.writeFileSync('www/downloads/packaging-sentinel.apk','must not be packaged');"
          gradle -p android :app:assembleDebug :app:assembleRelease --no-daemon
      - name: Assemble both instrumentation APKs before emulator startup
        run: |
          gradle -p android :app:assembleDebugAndroidTest --no-daemon
          gradle -p android :app:assembleReleaseAndroidTest -PpeTestBuildType=release --no-daemon
      - name: Preserve assembled APKs even if emulator provisioning fails
        uses: actions/upload-artifact@v4
        with:
          name: pocket-engineer-android-pretest
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/androidTest/*/*.apk
            android-signing-status.txt
      - name: Check release signature and 16KB packaging
        run: |
          node tools/test_android_assets.mjs android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 android/app/build/outputs/apk/release/app-release.apk
          unzip -q android/app/build/outputs/apk/release/app-release.apk 'lib/*' -d "$RUNNER_TEMP/pe-apk-alignment"
          python3 tools/check_android_alignment.py "$RUNNER_TEMP/pe-apk-alignment/lib"
      - name: Enable KVM for offline emulator tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise bundled app on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          # A lower request avoids additional growth, but the base image still
          # needs >7 GB; unused SDK releases are removed above to make room.
          disk-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          script: bash tools/android_variants_test.sh
      - name: Upload offline Android APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocket-engineer-android-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android-signing-status.txt
            android/app/build/outputs/apk/androidTest/*/*.apk
      - name: Upload Android test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-evidence
          path: android/app/build/reports/androidTests/
