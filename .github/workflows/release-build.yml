name: build-and-package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Generate and compare smoke corpus
        if: runner.os != 'Windows'
        run: |
          ./build/pe-generate-tests test-data-smoke-ci 25
          ./build/pe-verify-corpus test-data-smoke-ci 0 corpus-comparison.json
        shell: bash
      - name: Generate and compare smoke corpus on Windows
        if: runner.os == 'Windows'
        run: |
          .\build\Release\pe-generate-tests.exe test-data-smoke-ci 25
          .\build\Release\pe-verify-corpus.exe test-data-smoke-ci 0 corpus-comparison.json
      - name: Package offline desktop site
        run: cpack --config build/CPackConfig.cmake -G ZIP -C Release
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: pocket-engineer-${{ matrix.os }}
          path: |
            '*.zip'
            corpus-comparison.json

  android:
    name: android-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install pinned native Android build tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264" "cmake;3.22.1"
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Assemble offline release APK
        run: gradle -p android :app:assembleRelease --no-daemon
      - name: Upload offline Android APK
        uses: actions/upload-artifact@v4
        with:
          name: pocket-engineer-android-apk
          path: android/app/build/outputs/apk/release/*.apk
